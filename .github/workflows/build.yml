#
# Build both halves, prove they still agree, and package them.
#
# This exists for two reasons. The first is the one that pays for itself immediately: the
# C++ engine is a port of the C# one, and the only thing keeping them honest is a check
# that compares them against numbers generated from the original. Until now that check ran
# when somebody remembered. Now it runs on every push, and a port that has drifted cannot
# reach a release.
#
# The second is code signing. SignPath and Azure Trusted Signing both sign artifacts
# produced by a build system they trust, not files from somebody's laptop - that is the
# whole basis of the attestation. So a pipeline like this is the prerequisite for ever
# signing the installer, whichever route is taken.
#
name: build

on:
  push:
    branches: [main, macos]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only what the release step needs, and only then.
permissions:
  contents: write

env:
  # Pinned rather than tracking whatever JUCE's main branch is today: a framework that
  # changes underneath a build makes "it worked yesterday" impossible to reason about.
  # This is the version the plugin was developed against.
  JUCE_VERSION: '9.0.2'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------- the editor
      #
      # No .NET SDK is involved. The editor is built by csc.exe from .NET Framework 4,
      # which is on every Windows runner as it is on every Windows machine since about
      # 2010 - see build.ps1 for why that was the right dependency to have.
      #
      #
      # The icon is an artefact built from two SVGs, so it is made here rather than
      # committed - the same bargain as everything else generated in this repository.
      # It needs a browser to rasterise the drawings, and the Windows runner has both
      # Edge and Chrome; build-icon.ps1 takes whichever it finds.
      #
      # It runs before the editor and the plugin because both embed what it produces.
      #
      - name: Draw the icon
        shell: pwsh
        run: .\Icon\build-icon.ps1

      - name: Build the editor
        shell: pwsh
        run: .\build.ps1

      - name: Check the editor
        shell: pwsh
        run: |
          # PatchCheck and AudioCheck skip themselves here: one wants the library of real
          # Akai disks, which is other people's audio and is not in this repository, and
          # the other wants a sound card.
          #
          # Everything else runs, including the four checks that read disks\. Those need
          # well-formed disks rather than that library, so test.ps1 writes them with
          # AkaiS950Synth when the folder is empty - which on a fresh clone it always is,
          # since *.hfe is ignored. No step is needed here to prepare them.
          .\test.ps1

      # ------------------------------------------------------------------- the plugin

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}

      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 --branch $env:JUCE_VERSION https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure the plugin
        shell: pwsh
        run: cmake -S Plugin -B Plugin/build -DJUCE_PATH="$PWD/JUCE"

      - name: Build the plugin
        shell: pwsh
        run: cmake --build Plugin/build --config Release --parallel

      #
      # The gate. This is what says the port still agrees with the engine it came from -
      # 65 filter cutoffs, 35 envelope times, the LFO rates and delay fades, every measured
      # constant, the filter's DC gain and stopband, the engine driven through its event
      # ring, and notes landing on the sample they were asked for.
      #
      # It links no JUCE and needs no audio device. If this fails, nothing built on top of
      # it is worth shipping.
      #
      - name: Does the C++ still agree with the C#
        shell: pwsh
        run: .\Plugin\build\Release\ConformanceCheck.exe

      # ----------------------------------------------------------------- the installer

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      #
      # The sound library, before the installer script is checked rather than while it is
      # being built.
      #
      # build-installer.ps1 writes these itself, which is right for a person at a keyboard
      # - but the check that every Source in the .iss exists runs first here, and on a
      # fresh clone the disks do not. That check is the whole point of the step, so the
      # answer is to make the disks earlier, not to teach it to overlook a missing file.
      #
      - name: Write the sound library
        shell: pwsh
        run: .\AkaiS950Synth\build.ps1 -To Installer\staging\Disks

      #
      # The Mac job below cannot make either of these - the disks come from the C# synth
      # and the icon from a browser rasterising two SVGs, both Windows-side - so it takes
      # them from here, and the two platforms ship the same library and the same face.
      #
      - name: Hand the library and the icon to the Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Mz950-for-mac
          path: |
            Installer/staging/Disks/*.hfe
            Icon/icon-1024.png
            Icon/icon-128.png
          if-no-files-found: error

      - name: Check the installer script
        shell: pwsh
        working-directory: Installer
        run: .\check-installer.ps1

      - name: Build the installer
        shell: pwsh
        working-directory: Installer
        run: .\build-installer.ps1 -SkipBuild

      - name: Checksum
        shell: pwsh
        working-directory: Installer/Output
        run: |
          $exe = Get-ChildItem *.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Tee-Object -FilePath SHA256SUMS.txt
          "SHA256=$hash" >> $env:GITHUB_ENV
          "SETUP_NAME=$($exe.Name)" >> $env:GITHUB_ENV

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Mz950-installer
          path: |
            Installer/Output/*.exe
            Installer/Output/SHA256SUMS.txt
          if-no-files-found: error

      # ------------------------------------------------------------------- the release
      #
      # Only on a tag, and the tag is what makes the AGPL work: a binary obliges you to
      # offer the source it was built from, and "v0.1.0 came from tag v0.1.0" answers that
      # exactly where a file on a web host answers nothing.
      #
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Mac zip goes on pre-releases only for now (see the mac job), so only they
          # say anything about it.
          $macNotes = ''
          if ($env:GITHUB_REF_NAME -match '-') {
              $macNotes = @"
          ### macOS

          **Mz950-*-macOS.zip** has the VST3, an Audio Unit for Logic and GarageBand, the
          standalone app and the sound library, for Apple Silicon and Intel, macOS 11 or
          later. It isn't notarized by Apple, so macOS won't open it with a double-click:
          install it with one Terminal command, as **READ ME FIRST.txt** inside explains.
          Mz950 Studio, the disk editor, is Windows-only.
          "@
          }

          $notes = @"
          Built from ``$env:GITHUB_SHA`` by GitHub Actions.

          ``````
          SHA-256  $env:SHA256
          ``````

          ### The installer is not signed

          Windows will say **"Windows protected your PC"** and hide the Run button behind
          **More info**. That is SmartScreen reacting to an executable it has not seen
          before, not a judgement about this one. Check the SHA-256 above if you would
          rather verify than trust.

          ### What it installs

          - **Mz950 Studio** - open, edit and save S900/S950 disk images (.hfe and .img)
          - **Mz950** - a VST3 that plays those disks back in a DAW
          - **Standalone** - the same emulator without a host
          - **A sound library** - five disks of synthesised sounds, so it makes a noise
            without your owning a single floppy
          - **A tutorial**, in the program group and under **Help** in the editor

          Each is optional, and the installer asks whether it is for everyone or just you.

          $macNotes

          ### Licence

          AGPLv3. The source for this build is the tag it was made from.
          "@

          #
          # A release made by hand before this step got here - v0.5.0 was - used to fail
          # the whole run on "already exists" and leave the page with nothing to download.
          # Now the build is attached to it instead, and the notes written for it are kept.
          #
          $PSNativeCommandUseErrorActionPreference = $false
          $tag    = $env:GITHUB_REF_NAME
          $title  = "Mz950 $tag"
          $assets = @("Installer/Output/$env:SETUP_NAME", "Installer/Output/SHA256SUMS.txt")

          #
          # A tag with a hyphen in it - v0.6.1-beta1 - is a pre-release: labelled as one, and
          # never "Latest", so /releases/latest (the link handed out everywhere) keeps
          # pointing at the last real release while a beta is out for testing.
          #
          $pre = @()
          if ($tag -match '-') { $pre = @('--prerelease') }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assets --clobber
              if ($LASTEXITCODE -ne 0) { exit 1 }
              gh release edit $tag --title $title @pre
          } else {
              gh release create $tag @assets --title $title --notes $notes @pre
          }
          exit $LASTEXITCODE

  # =============================================================================== macOS
  #
  # The plugin and the standalone for the Mac, as a plain zip: VST3, an Audio Unit (Logic
  # and GarageBand load nothing else) and the app, universal for Apple Silicon and Intel.
  #
  # Deliberately NOT signed with an Apple Developer ID and NOT notarized - this project
  # does not go through Apple. Each bundle carries only the free ad-hoc signature Apple
  # Silicon requires before it will run code at all, and READ ME FIRST.txt / install.sh
  # take the user through the quarantine flag instead.
  #
  # After the Windows job, not beside it: that job writes the sound library (the C# synth)
  # and draws the icon (a browser rasterising SVGs), neither of which runs here, and on a
  # tag it is the one that creates the release this job then adds the zip to.
  #
  mac:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Take the library and the icon from the Windows build
        uses: actions/download-artifact@v4
        with:
          name: Mz950-for-mac
          path: .

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-mac-${{ env.JUCE_VERSION }}

      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      #
      # Nobody working on this has a Mac, so a compile error here is read back through the
      # API rather than from the log: the first forty "error:" lines become annotations,
      # which the check-runs API serves without signing in.
      #
      - name: Configure the plugin
        run: |
          set -o pipefail
          cmake -S Plugin -B Plugin/build -DJUCE_PATH="$PWD/JUCE" -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                2>&1 | tee configure.log || {
            grep -E "Error|error" configure.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Build the plugin
        run: |
          set -o pipefail
          cmake --build Plugin/build --config Release --parallel 2>&1 | tee build.log || {
            grep -E "error:|Error [0-9]" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Does the C++ still agree with the C#
        run: ./Plugin/build/ConformanceCheck

      - name: Does the disk writer round-trip the library
        run: |
          for disk in Installer/staging/Disks/*.hfe; do
            printf '%-20s ' "$(basename "$disk")"
            ./Plugin/build/DiskEditCheck "$disk" | tail -1
          done

      - name: Universal, and ad-hoc signed
        run: |
          art=Plugin/build/VirtualS950_artefacts/Release
          lipo -archs "$art/VST3/Mz950.vst3/Contents/MacOS/Mz950"
          lipo -archs "$art/AU/Mz950.component/Contents/MacOS/Mz950"
          lipo -archs "$art/Standalone/Mz950.app/Contents/MacOS/Mz950"
          for b in "$art/VST3/Mz950.vst3" "$art/AU/Mz950.component" "$art/Standalone/Mz950.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict "$b"
          done

      #
      # Apple's own Audio Unit validator: the check Logic runs before it will list a plugin,
      # so an AU that fails here would never appear there.
      #
      - name: Validate the Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Mz950.component
          ditto Plugin/build/VirtualS950_artefacts/Release/AU/Mz950.component \
                ~/Library/Audio/Plug-Ins/Components/Mz950.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i mz950 || true
          auval -v aumu Ak95 Smoz

      - name: Package
        run: |
          ver=$(sed -n 's/^project(VirtualS950 VERSION \([0-9.]*\).*/\1/p' Plugin/CMakeLists.txt)
          name="Mz950-$ver-macOS"
          art=Plugin/build/VirtualS950_artefacts/Release
          out="dist/$name"
          mkdir -p "$out/Disks" "$out/docs/img"

          ditto "$art/VST3/Mz950.vst3"        "$out/Mz950.vst3"
          ditto "$art/AU/Mz950.component"     "$out/Mz950.component"
          ditto "$art/Standalone/Mz950.app"   "$out/Mz950.app"
          cp Installer/staging/Disks/*.hfe    "$out/Disks/"
          cp "Installer/mac/READ ME FIRST.txt" Installer/mac/install.sh "$out/"
          chmod +x "$out/install.sh"
          cp LICENSE CHANGELOG.md "$out/"
          cp Plugin/README.md "$out/README-plugin.md"
          cp docs/tutorial.html "$out/docs/"
          cp docs/img/*.png "$out/docs/img/"

          # ditto, not zip: bundles hold symlinks and executable bits a plain zip can lose
          (cd dist && ditto -c -k --keepParent "$name" "$name.zip")
          (cd dist && shasum -a 256 "$name.zip" | tee SHA256SUMS-macOS.txt)
          ls -l dist

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Mz950-macOS
          path: |
            dist/*.zip
            dist/SHA256SUMS-macOS.txt
          if-no-files-found: error

      #
      # Pre-releases only (a tag with a hyphen, v0.6.1-beta2) until the Mac build has been
      # tried on a real Mac and reported on. A full release is Windows-only until then; the
      # zip is still built and kept as this run's artifact either way.
      #
      - name: Add it to the release
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS-macOS.txt --clobber --repo "$GITHUB_REPOSITORY"
